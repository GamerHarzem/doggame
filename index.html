<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DogGame - Brawl Stars Edition</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#38bdf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DogGame">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b2e7a;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.hidden{display:none !important}
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:14px;padding:8px 18px;font-weight:900;font-size:18px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.4);z-index:10}
.blue{color:#38bdf8}.red{color:#ff4757}
#msg{position:fixed;top:42%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;background:rgba(0,0,0,.8);border:2px solid #fff;padding:8px 16px;border-radius:12px;display:none;z-index:10}
#joy{position:fixed;left:30px;bottom:30px;width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.3);z-index:10}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn{position:fixed;width:84px;height:84px;border-radius:50%;border:3px solid #0b2e7a;font-weight:900;font-size:15px;color:#fff;box-shadow:0 6px 0 #0b2e7a;cursor:pointer;z-index:10}
#btnAtk{right:24px;bottom:30px;background:#ff2a5f}
#btnAb{right:124px;bottom:30px;background:#ffd34d;color:#000}
#btnJump{right:224px;bottom:30px;background:#7CFF3B;color:#000}
.btn.icon{font-size:38px}
#wallet{position:fixed;top:12px;right:12px;z-index:50;display:flex;gap:10px}
.cur{background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:14px;padding:6px 12px;text-align:center;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.4);min-width:80px}
.cur span{display:block;font-size:18px;color:#ffd34d}
.cur small{display:block;font-size:14px}
.coin{width:28px;height:28px;margin:2px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6a8,#f5c400 55%,#b8860b);border:2px solid #9a6b00;display:flex;align-items:center;justify-content:center;font-size:14px}
#emotes{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:14px;padding:6px 8px;z-index:40}
#emotes button{width:46px;height:46px;border:2px solid #0b2e7a;border-radius:12px;background:#fff;font-size:24px;box-shadow:0 3px 0 #0b2e7a;cursor:pointer}
#emotes:empty{display:none}
.panel-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:100}
.panel{background:linear-gradient(180deg,#38bdf8 0%,#2563eb 60%,#1e3a8a 100%);padding:24px;border-radius:24px;border:4px solid #fff;text-align:center;min-width:300px;max-width:92vw;max-height:92vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.5)}
.panel.wide{max-width:min(900px,95vw)}
.panel h1{margin:0 0 6px;font-size:36px;color:#ffd34d;text-shadow:0 4px 0 #7a4a00}
.panel h2{margin:0 0 12px;font-size:26px;color:#fff;text-shadow:0 3px 0 #000}
.panel p{color:#fff;font-size:15px;line-height:1.5;margin:6px 0;text-shadow:0 2px 0 #000}
#breeds{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.breed{width:66px;height:66px;padding:0;border-radius:16px;background:#fff;border:3px solid #0b2e7a;box-shadow:0 5px 0 #0b2e7a;font-weight:900;font-size:11px;color:#222;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.breed.sel{background:#ffd34d;border-color:#7a4a00;box-shadow:0 5px 0 #7a4a00;color:#000}
.mode,#replay,#toMenu,#shopBtn,#shopClose,.wideBtn{display:block;width:100%;margin:10px 0;padding:14px;font-size:18px;font-weight:900;border:3px solid #0b2e7a;border-radius:16px;color:#fff;background:#2563eb;cursor:pointer;box-shadow:0 6px 0 #0b2e7a;text-shadow:0 2px 0 #000}
.mode:hover,#replay:hover,#toMenu:hover,#shopBtn:hover,#shopClose:hover,.wideBtn:hover{filter:brightness(1.1)}
.shopLayout{display:flex;gap:16px;align-items:flex-start;text-align:left}
.previewBox{flex:0 0 250px;background:rgba(0,0,0,.3);border:3px solid #fff;border-radius:18px;padding:8px;text-align:center}
#previewCanvas{width:240px;height:300px;display:block;margin:0 auto}
#previewName{font-weight:900;color:#ffd34d;font-size:14px;min-height:20px;margin:6px 0;text-shadow:0 2px 0 #000}
#shopList{flex:1;min-width:0;max-height:62vh;overflow:auto;padding-right:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin-bottom:8px;border:2px solid #0b2e7a;border-radius:12px;background:rgba(255,255,255,.9);color:#222;font-size:15px;cursor:pointer}
.item small{color:#555}
.item button{padding:8px 14px;border:2px solid #0b2e7a;border-radius:10px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #0b2e7a}
.codeRow{display:flex;gap:8px;margin:10px 0}
.codeRow input{flex:1;padding:12px;border:3px solid #0b2e7a;border-radius:14px;font-size:16px;font-weight:900}
.codeRow button{padding:12px 18px;border:3px solid #7a4a00;border-radius:14px;background:#ffd34d;color:#000;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #7a4a00}
#codeMsg{color:#ffd34d;font-weight:900;text-shadow:0 2px 0 #000}
.bsTop{display:flex;gap:8px;align-items:center;padding:8px 0;flex-wrap:wrap;justify-content:center}
.bsChip{background:rgba(0,0,0,.4);color:#fff;font-weight:900;border-radius:999px;padding:6px 14px;font-size:14px;border:2px solid #fff;text-shadow:0 2px 0 #000}
.playBtn{display:block;width:100%;margin:14px 0;padding:16px 0;border:3px solid #0b2e7a;border-radius:20px;background:#7CFF3B;color:#fff;font-size:32px;font-weight:900;letter-spacing:.05em;text-shadow:0 3px 0 #2d6a00;box-shadow:0 8px 0 #2d6a00;cursor:pointer}
.bsNav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#0b2e7a;padding:10px;border-top:4px solid #38bdf8;z-index:90}
.navBtn{flex:1;background:transparent;border:none;color:#fff;font-size:20px;font-weight:900;cursor:pointer;padding:4px}
.navBtn span{display:block;font-size:12px}
.navBtn.active{color:#ffd34d}
.breedImg{display:block;height:160px;width:auto;max-width:90%;margin:6px auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.boxStage{position:relative;width:200px;height:200px;margin:10px auto}
.boxRays{position:absolute;inset:-40px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,#ffd34d 0 10deg,transparent 10deg 20deg);transition:opacity .4s}
.boxRays.on{opacity:.95;animation:raySpin 4s linear infinite}
@keyframes raySpin{to{transform:rotate(360deg)}}
.gift{position:absolute;left:30px;top:70px;width:140px;height:110px}
.gift.shaking{animation:boxShake .15s infinite}
.giftBody{position:absolute;inset:0;border-radius:16px;background:linear-gradient(180deg,#ff5a6e,#e0123a);border:4px solid #0b2e7a;box-shadow:0 8px 0 #0b2e7a}
.giftLid{position:absolute;left:-8px;top:-34px;width:156px;height:44px;border-radius:14px;background:linear-gradient(180deg,#ff7b8c,#f0203f);border:4px solid #0b2e7a;box-shadow:0 6px 0 #0b2e7a;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.giftLid.open{transform:translate(30px,-70px) rotate(-24deg);opacity:0}
.ribV{position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:#ffd34d;border-left:3px solid #0b2e7a;border-right:3px solid #0b2e7a}
.ribH{position:absolute;top:50%;left:0;right:0;height:22px;margin-top:-11px;background:#ffd34d;border-top:3px solid #0b2e7a;border-bottom:3px solid #0b2e7a}
.bow{position:absolute;left:50%;top:-22px;width:50px;height:28px;margin-left:-25px;background:#ffd34d;border:3px solid #0b2e7a;border-radius:10px}
@keyframes boxShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,2px) rotate(-4deg)}75%{transform:translate(5px,-2px) rotate(4deg)}}
#boxRewards{white-space:pre-line;font-weight:900;color:#ffd34d;font-size:18px;min-height:48px;text-shadow:0 2px 0 #000}
</style>
</head>
<body>
<div id="top"><span class="blue" id="scoreB">0</span><span id="timer">2:00</span><span class="red" id="scoreR">0</span></div>
<div id="msg"></div>
<div id="emotes"></div>
<div id="wallet">
  <div class="cur"><span id="wGold">0</span><div class="coin">🐾</div></div>
  <div class="cur"><span id="wGems">0</span><small>💎</small></div>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="btnAb" class="btn icon" title="Yetenek">🐶</button>
<button id="btnAtk" class="btn icon" title="Saldır">🐾</button>
<button id="btnJump" class="btn icon" title="Zıpla">⬆️</button>

<div id="menu" class="panel-wrap">
  <div class="panel">
    <div class="bsTop">
      <span class="bsChip">🟢 <b id="onlineCount">1</b></span>
      <span class="bsChip">🏆 <b id="trophyShow">0</b></span>
      <span class="bsChip">📦 <b id="boxTop">0</b></span>
    </div>
    <h1>DogGame</h1>
    <p>Brawl Stars Tarzı Köpek Savaşları</p>
    <div id="breeds"></div>
    <img id="breedImg" class="breedImg" alt="">
    <p id="breedInfo"></p>
    <button id="breedBuy" class="wideBtn hidden" style="background:#ffd34d;color:#000">🔓 Aç</button>
    <button class="playBtn" data-mode="3v3">OYNA</button>
    <button class="mode" data-mode="1v1">Botla Savaş (1v1)</button>
    <button class="mode" id="bossMenuBtn">👹 Boss Savaşı</button>
    <button class="mode" id="shopBtn">🛒 Mağaza</button>
    <div class="codeRow"><input id="codeIn" placeholder="Örn: harzem1903" autocomplete="off"><button id="codeBtn">Kullan</button></div>
    <p id="codeMsg"></p>
  </div>
  <nav class="bsNav">
    <button class="navBtn active" id="navPlay">🎮<span>Oyna</span></button>
    <button class="navBtn" id="navShop" onclick="document.getElementById('shopBtn').click()">🛒<span>Mağaza</span></button>
  </nav>
</div>

<div id="boxPanel" class="panel-wrap hidden">
  <div class="panel">
    <h2 id="boxTitle">Brawl Kutusu</h2>
    <div id="boxStage" class="boxStage">
      <div id="boxRays" class="boxRays"></div>
      <div id="gift" class="gift">
        <div class="giftBody"><div class="ribV"></div><div class="ribH"></div></div>
        <div id="giftLid" class="giftLid"><div class="ribV"></div><div class="bow"></div></div>
      </div>
    </div>
    <p id="boxRewards"></p>
    <button class="wideBtn" id="boxOk" disabled>Tamam</button>
  </div>
</div>

<div id="shop" class="panel-wrap hidden">
  <div class="panel wide">
    <h2>Mağaza</h2>
    <p id="shopGold"></p>
    <div class="shopLayout">
      <div class="previewBox">
        <canvas id="previewCanvas"></canvas>
        <p id="previewName"></p>
      </div>
      <div id="shopList"></div>
    </div>
    <p id="shopMsg"></p>
    <button id="shopClose">Geri</button>
  </div>
</div>

<div id="end" class="panel-wrap hidden">
  <div class="panel">
    <h2 id="endText"></h2>
    <button id="replay" class="wideBtn">Tekrar Oyna</button>
    <button id="toMenu" class="wideBtn" style="background:#1e3a8a">Ana Menü</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const AX = 120, AZ = 80, SPEED = 10, MATCH_TIME = 120, WIN_SCORE = 15;
let selectedBreed = 'shiba', viewBreed = 'shiba';

const SAVE_KEY = 'doggame_save_v2';
let save = { gold: 5000, gems: 100, owned: [], unlocked: ['shiba'], boxes: 3, equip: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const BREEDS = {
  shiba: { name: 'Shiba', fur: 0xE7A564, cream: 0xFFF4E3, leg: 0xC98244, hp: 6000, atk: 550, abil: 'Atılma', desc: 'Hızla ileri atılır.' },
  husky: { name: 'Husky', fur: 0x9AA3AE, cream: 0xFFFFFF, leg: 0x6E7782, hp: 6000, atk: 650, abil: 'Uluma', desc: 'Etrafı sersemletir.' },
  corgi: { name: 'Corgi', fur: 0xD9893F, cream: 0xFFF4E3, leg: 0xB06A2A, hp: 5500, atk: 500, abil: 'Sıçrama', desc: 'Yukarı zıplar, hasar verir.' },
  golden: { name: 'Golden', fur: 0xE8B84A, cream: 0xFFF0C0, leg: 0xC9962F, hp: 6500, atk: 550, abil: 'Şifa', desc: 'Can yeniler.' }
};

const SHOP = [
  { id: 'sun', type: 'face', name: 'Güneş Gözlüğü', price: 300, cur: 'gold', color: 0x111111, icon: '😎', desc: 'Havalı gözlük.' },
  { id: 'cap', type: 'hat', name: 'Kırmızı Şapka', price: 500, cur: 'gold', color: 0xD7263D, icon: '🧢', desc: 'Klasik şapka.' }
];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x38bdf8);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
scene.add(new THREE.HemisphereLight(0xffffff, 0x066B0A, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(8, 20, 6);
scene.add(sun);

// Brawl Stars Tarzı Zemin ve Harita Blokları
const obstacles = [], chests = [];
function buildWorld() {
  // Canlı çim zemin
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(AX * 2, AZ * 2), new THREE.MeshToonMaterial({ color: 0x3E9B3E }));
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -0.2;
  scene.add(plane);

  // Renkli Engeller ve Nehirler (Brawl Stars Map Stilinde)
  for (let i = 0; i < 25; i++) {
    const x = (Math.random() * 2 - 1) * AX * 0.7, z = (Math.random() * 2 - 1) * AZ * 0.7;
    const box = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 3), new THREE.MeshToonMaterial({ color: 0x992A7A }));
    box.position.set(x, 1, z);
    scene.add(box);
    obstacles.push({ x, z, hw: 1.5, hd: 1.5 });
  }
}
buildWorld();

// Karakter Oluşturma
function buildDog(teamHex, b) {
  const root = new THREE.Group();
  const fur = new THREE.MeshToonMaterial({ color: b.fur });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 2), fur);
  body.position.y = 1;
  root.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), fur);
  head.position.set(0, 1.8, 0.8);
  root.add(head);
  return { g: root };
}

let fighters = [], player = null, state = 'menu', remaining = MATCH_TIME, mode = '3v3', clock = 0;

function startMatch(m) {
  mode = m;
  state = 'playing';
  remaining = MATCH_TIME;
  $('menu').classList.add('hidden');
  
  const b = BREEDS[selectedBreed];
  player = { pos: new THREE.Vector3(0, 0, 0), hp: b.hp, maxHp: b.hp, atk: b.atk, alive: true, team: 'blue', view: buildDog(0x2f7dff, b) };
  scene.add(player.view.g);
  fighters.push(player);
}

// Paket Açılış Sistemi (Brawl Box Animasyonu)
$('boxTop').textContent = save.boxes;
$('boxOpenBtn')?.addEventListener('click', () => {
  if (save.boxes <= 0) return;
  save.boxes--;
  save.gold += 250;
  persist();
  $('boxTop').textContent = save.boxes;
  
  const gift = $('gift'), lid = $('giftLid'), rays = $('boxRays');
  gift.classList.add('shaking');
  $('boxTitle').textContent = 'Kutu Açılıyor...';
  $('boxRewards').textContent = '';
  $('boxOk').disabled = true;
  $('boxPanel').classList.remove('hidden');

  setTimeout(() => {
    gift.classList.remove('shaking');
    gift.classList.add('open');
    lid.classList.add('open');
    rays.classList.add('on');
    $('boxTitle').textContent = 'HARİKA ÖDÜL!';
    $('boxRewards').textContent = '🪙 +250 Altın Kazandın!';
    $('boxOk').disabled = false;
  }, 1000);
});
$('boxOk').addEventListener('click', () => $('boxPanel').classList.add('hidden'));

// Mağaza Önizleme Render
const pvCanvas = $('previewCanvas');
const pvRenderer = new THREE.WebGLRenderer({ canvas: pvCanvas, antialias: true, alpha: true });
pvRenderer.setSize(240, 300, false);
const pvScene = new THREE.Scene();
const pvCam = new THREE.PerspectiveCamera(38, 240 / 300, 0.1, 50);
pvCam.position.set(0, 2.4, 8.5);
pvCam.lookAt(0, 1.5, 0);
pvScene.add(new THREE.HemisphereLight(0xffffff, 0xe8c9a0, 1.0));
let pvDog = buildDog(0x2f7dff, BREEDS.shiba);
pvScene.add(pvDog.g);

$('shopBtn').addEventListener('click', () => {
  $('menu').classList.add('hidden');
  $('shop').classList.remove('hidden');
  $('shopGold').textContent = `Altın: ${save.gold} · Elmas: ${save.gems} 💎`;
  const list = $('shopList');
  list.innerHTML = '';
  SHOP.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span><b>${item.icon} ${item.name}</b> — ${item.price} Altın</span><button>Al</button>`;
    list.appendChild(row);
  });
});
$('shopClose').addEventListener('click', () => {
  $('shop').classList.add('hidden');
  $('menu').classList.remove('hidden');
});

// Kod Kullanma (Örn: harzem1903)
$('codeBtn').addEventListener('click', () => {
  const val = $('codeIn').value.trim().toLowerCase();
  if (val === 'harzem1903') {
    save.gems += 50;
    save.gold += 1000;
    persist();
    $('codeMsg').textContent = 'Tebrikler! 1000 altın ve 50 elmas kazandın!';
  } else {
    $('codeMsg').textContent = 'Geçersiz kod!';
  }
  $('codeIn').value = '';
});

// Joystick & Kontroller
let joyId = null, joyX = 0, joyZ = 0;
const joy = $('joy'), knob = $('knob');
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); });
joy.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const max = 45, len = Math.hypot(dx, dy);
  if (len > max) { dx *= max / len; dy *= max / len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joyX = dx / max; joyZ = dy / max;
});
const endJoy = e => { if (e.pointerId === joyId) { joyId = null; joyX = 0; joyZ = 0; knob.style.transform = ''; } };
joy.addEventListener('pointerup', endJoy);
joy.addEventListener('pointercancel', endJoy);

// Ana Oyun Döngüsü
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  clock += dt;

  if (state === 'playing' && player) {
    player.pos.x += joyX * SPEED * dt;
    player.pos.z += joyZ * SPEED * dt;
    player.view.g.position.copy(player.pos);
    if (joyX || joyZ) player.view.g.rotation.y = Math.atan2(joyX, joyZ);
  }

  // Kamera Takibi
  if (player) {
    camera.position.set(player.pos.x, player.pos.y + 9, player.pos.z + 12);
    camera.lookAt(player.pos.x, player.pos.y + 1, player.pos.z);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => startMatch(b.dataset.mode)));
$('toMenu').addEventListener('click', () => {
  state = 'menu';
  $('end').classList.add('hidden');
  $('menu').classList.remove('hidden');
});

requestAnimationFrame(frame);
</script>
</body>
</html>
